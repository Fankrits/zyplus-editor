<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zyplus.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zyplus</title>
    <script>
      // Resolve the theme before first paint, otherwise dark-mode launches flash white.
      (function () {
        try {
          var t = localStorage.getItem("zyplus:theme");
        } catch (e) {}
        var dark =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
