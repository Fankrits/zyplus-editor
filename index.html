<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zyplus.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zyplus</title>
    <script>
      // Resolve the theme before first paint, otherwise dark-mode launches flash white.
      // theme-base is written by setTheme(); "" means follow the OS.
      (function () {
        try {
          var t = localStorage.getItem("zyplus:theme");
          var base = localStorage.getItem("zyplus:theme-base");
        } catch (e) {}
        var dark = base
          ? base === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        if (base && t) root.dataset.palette = t;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
