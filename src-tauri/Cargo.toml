[package]
name = "zyplus-editor"
version = "0.3.0"
description = "Zyplus, a markdown editor that gets out of the way"
authors = ["Fankrits"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zyplus_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Required by `tauri::generate_context!`, which expands to `::serde_json` paths.
serde_json = "1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"


# The updater brings its own TLS (rustls + ring, about half a megabyte). Linux keeps it:
# the system one there is OpenSSL, a dynamic library the AppImage would have to carry.
# macOS and Windows ship a TLS stack of their own, so use that and drop the bundled one.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = "2.11.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[profile.release]
# Size over speed: this side is file and window glue, the editing happens in the webview.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
