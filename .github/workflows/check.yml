name: Check

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The three targets the app ships to. Platform-specific breakage — path
    # handling, the macOS-only PDF exporter, the key maps — is only caught by
    # running the checks on each of them, so the matrix is the point.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: bun install --frozen-lockfile

      # bun test, tsc, cargo fmt --check, cargo clippy, cargo test.
      - run: bun run check

      # Releases download extensions/dist from their own tag and check it against
      # src/extensions/checksums.json, so both must be committed, current, and in
      # step. A source change without `bun run build:extensions` fails here.
      - name: Extension bundles are up to date
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          bun run build:extensions
          git diff --exit-code -- extensions/dist src/extensions/checksums.json
