name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "for (const f of ['package.json','src-tauri/tauri.conf.json']) { const j=JSON.parse(require('fs').readFileSync(f)); j.version='$V'; require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n'); }"
          sed -i.bak -e "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak

      - run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zyplus ${{ github.ref_name }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  cask:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump Homebrew cask
        run: |
          V="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Zyplus_${V}_universal.dmg"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          sed -i -e "s/^  version .*/  version \"$V\"/" -e "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/zyplus.rb
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore(cask): zyplus $V" && git push
