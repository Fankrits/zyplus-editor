name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package without publishing a GitHub release or bumping the cask"
        type: boolean
        required: false
        default: true
      tag:
        description: "Version tag to build (e.g. v0.2.4); defaults to Cargo.toml version"
        type: string
        required: false
        default: ""

jobs:
  # Nothing is built for release, signed or published unless the same checks CI
  # runs pass on this exact commit.
  verify:
    name: Verify (fmt, lint, unit, e2e)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          key: release-verify
      - run: ./scripts/test.sh quick
      - name: End-to-end suite
        env:
          TMPDIR: ${{ runner.temp }}/e
        run: |
          mkdir -p "$TMPDIR"
          ./scripts/test.sh e2e -- --report e2e-report.json
      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-report
          path: e2e-report.json
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry_run }}"
            RAW_TAG="${{ inputs.tag }}"
            if [ -z "$RAW_TAG" ]; then
              RAW_TAG="v$(awk -F'"' '/^\[/{sec=$0} /^version = /{ if (sec == "[package]") { print $2; exit } }' Cargo.toml)"
            fi
          else
            DRY_RUN="false"
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          V="${RAW_TAG#v}"
          # The tag name is text anyone with push access chose; validate it before
          # passing it to any script or filename.
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Not a version tag: $RAW_TAG" >&2
            exit 1
          }
          TAG="v${V}"
          PRERELEASE="false"
          if [[ "$V" == *-* ]]; then
            PRERELEASE="true"
          fi

          if [ "$DRY_RUN" != "true" ] && [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required for a non-dry-run release." >&2
            exit 1
          fi

          {
            echo "version=$V"
            echo "tag=$TAG"
            echo "dry_run=$DRY_RUN"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - name: Stamp version into Cargo.toml and Cargo.lock
        run: python3 scripts/release/stamp-version.py "${{ steps.meta.outputs.version }}"

      - name: Run release script unit tests
        run: python3 -m unittest discover -s scripts/release -v

      # Apple Silicon only: Intel Macs are not a supported target.
      - name: Build macOS arm64 binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      # A stable signature so macOS keeps Files & Folders grants across updates
      # (see scripts/make-signing-cert.sh). Skipped when the secret is absent.
      - name: Import macOS signing identity
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          [ -n "$CERT" ] || { echo "MACOS_SIGNING_CERT not set; building ad-hoc signed"; exit 0; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          # shellcheck disable=SC2046  # the keychain list is meant to split
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=Zyplus Self-Signed" >> "$GITHUB_ENV"

      - name: Bundle and sign Zyplus.app
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          # bundle-macos.sh expects the binary at <target>/release/zyplus-gpui.
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/zyplus-gpui target/release/zyplus-gpui
          SKIP_BUILD=1 SIGN_IDENTITY="${SIGN_IDENTITY:--}" ./scripts/bundle-macos.sh "$DIST"

      # The artifact that ships is a release build, which has no scripted-input
      # runner, so launch the real bundle: it must start, stay up and quit on
      # SIGTERM.
      - name: Smoke test the packaged app
        run: ./scripts/release/smoke-app.sh "$RUNNER_TEMP/dist/Zyplus.app" 8 --arch arm64

      - name: Package DMG and updater tarball
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          DIST="$RUNNER_TEMP/dist"
          ./scripts/release/make-dmg.sh "$DIST/Zyplus.app" "$DIST/Zyplus_${V}_aarch64.dmg"
          # Disable macOS AppleDouble (._*) entries so updater::check_archive_entries accepts every path.
          COPYFILE_DISABLE=1 tar -C "$DIST" -czf "$DIST/Zyplus.app.tar.gz" Zyplus.app
          tar -tzf "$DIST/Zyplus.app.tar.gz" | head -n 20

      - name: Sign updater tarball and generate latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          DRY_RUN="${{ steps.meta.outputs.dry_run }}"
          DIST="$RUNNER_TEMP/dist"

          cargo build --release --locked --manifest-path scripts/release/signer/Cargo.toml --target-dir target/release-signer
          SIGNER="target/release-signer/release/zyplus-release-signer"

          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            "$SIGNER" sign --file "$DIST/Zyplus.app.tar.gz" --out "$DIST/Zyplus.app.tar.gz.sig"
            PUBKEY_B64="$(python3 -c 'import pathlib, re; print(re.search(r"const PUBKEY_B64:\s*&str\s*=\s*\"([^\"]+)\"", pathlib.Path("src/updater.rs").read_text()).group(1))')"
            [ -n "$PUBKEY_B64" ] || { echo "Could not read PUBKEY_B64 from src/updater.rs" >&2; exit 1; }
          else
            if [ "$DRY_RUN" != "true" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY secret is missing on a real release." >&2
              exit 1
            fi
            echo "dry_run without TAURI_SIGNING_PRIVATE_KEY: signing with an ephemeral throwaway key"
            "$SIGNER" keygen --out-key "$RUNNER_TEMP/dry-run.key" --out-pub "$RUNNER_TEMP/dry-run.pub"
            "$SIGNER" sign --file "$DIST/Zyplus.app.tar.gz" --out "$DIST/Zyplus.app.tar.gz.sig" --key-file "$RUNNER_TEMP/dry-run.key"
            PUBKEY_B64="$(tr -d '\r\n' < "$RUNNER_TEMP/dry-run.pub")"
          fi

          python3 scripts/release/make-manifest.py \
            --version "$V" \
            --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --asset "Zyplus.app.tar.gz" \
            --sig "$DIST/Zyplus.app.tar.gz.sig" \
            --notes "See the assets below to download and install." \
            --output "$DIST/latest.json"

          "$SIGNER" check-manifest \
            --manifest "$DIST/latest.json" \
            --file "$DIST/Zyplus.app.tar.gz" \
            --pubkey "$PUBKEY_B64"

      - name: Upload dry-run artifacts
        if: ${{ steps.meta.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: zyplus-${{ steps.meta.outputs.version }}-dry-run
          path: |
            ${{ runner.temp }}/dist/Zyplus_${{ steps.meta.outputs.version }}_aarch64.dmg
            ${{ runner.temp }}/dist/Zyplus.app.tar.gz
            ${{ runner.temp }}/dist/Zyplus.app.tar.gz.sig
            ${{ runner.temp }}/dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.meta.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          DIST="$RUNNER_TEMP/dist"
          ASSETS=(
            "$DIST/Zyplus_${V}_aarch64.dmg"
            "$DIST/Zyplus.app.tar.gz"
            "$DIST/Zyplus.app.tar.gz.sig"
            "$DIST/latest.json"
          )

          # The release page lists the updater files next to the DMG; say which one is for people.
          NOTES="$DIST/release-notes.md"
          cat > "$NOTES" <<EOF
          ## Install (Apple Silicon Mac)

          Download **Zyplus_${V}_aarch64.dmg**, open it, and drag **Zyplus** into **Applications**.

          The app is not notarized by Apple yet, so macOS may say it cannot be verified. Right-click the app, choose **Open**, then **Open** again (first launch only). Or run:
          \`xattr -dr com.apple.quarantine /Applications/Zyplus.app\`

          Or from a terminal, which skips that prompt: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | ZYPLUS_VERSION=${V} sh\`

          Intel Macs are not supported.

          ### Linux and Windows (experimental)

          If attached below: \`Zyplus_${V}_windows-x64-setup.exe\` (Windows installer), \`Zyplus_${V}_linux-amd64.deb\` (Debian/Ubuntu) and \`Zyplus_${V}_linux-x86_64.AppImage\` (any distro: make it executable and run it). They are only build-, install- and launch-checked, have no auto-update, and some macOS-only features (PDF export, default-app setting) are missing.

          ## Other files (you do not need these)

          \`Zyplus.app.tar.gz\`, \`.sig\` and \`latest.json\` are what the in-app updater downloads and verifies. "Source code" is added by GitHub.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            REL_FLAGS=(--title "Zyplus $TAG" --notes-file "$NOTES")
            if [ "$PRERELEASE" = "true" ]; then
              REL_FLAGS+=(--prerelease)
            else
              REL_FLAGS+=(--latest)
            fi
            gh release create "$TAG" "${ASSETS[@]}" "${REL_FLAGS[@]}"
          fi

  # Experimental Linux and Windows installers (.deb + AppImage, setup .exe).
  # Only build-, install- and launch-checked; no auto-update, so they are not
  # listed in latest.json.
  experimental:
    name: Experimental ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            python: python3
          - name: windows-x86_64
            os: windows-latest
            python: python
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: experimental-${{ matrix.name }}

      - name: Stamp version
        run: ${{ matrix.python }} scripts/release/stamp-version.py "$VERSION"

      - name: Build
        run: cargo build --release --locked

      # ---- Linux: .deb and AppImage -------------------------------------
      - name: Package (.deb, AppImage)
        if: startsWith(matrix.os, 'ubuntu-')
        run: ./scripts/release/make-linux-packages.sh "$VERSION" target/release/zyplus-gpui out

      # Install the .deb for real, then launch it and the AppImage under Xvfb
      # with Mesa's software Vulkan. Each must stay up for 8 seconds.
      - name: Install and launch the packages
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/h" TMPDIR="$RUNNER_TEMP/t"
          mkdir -p "$HOME" "$TMPDIR"
          sudo -S -p '' apt-get install -y ./out/*.deb
          dpkg -L zyplus | head
          cat > "$RUNNER_TEMP/launch.sh" <<'SH'
          "$@" > "$TMPDIR/app.log" 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then echo "alive after 8s: $*"; kill "$pid"; exit 0; fi
          echo "exited early: $*"; cat "$TMPDIR/app.log"; exit 1
          SH
          xvfb-run -a bash "$RUNNER_TEMP/launch.sh" /usr/bin/zyplus-gpui
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bash "$RUNNER_TEMP/launch.sh" ./out/*.AppImage

      # ---- Windows: Inno Setup installer --------------------------------
      - name: Package (setup .exe)
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\target\release\zyplus-gpui.exe" "/DOutDir=$PWD\out" "/DOutName=Zyplus_${env:VERSION}_windows-x64-setup" packaging\windows\zyplus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem out

      - name: Install and launch the installer
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'zyplus-install'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $dir 'zyplus-gpui.exe'
          if (-not (Test-Path $exe)) { throw "installed exe missing: $exe" }
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'smoke-home'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardError "$env:RUNNER_TEMP\app.err" -RedirectStandardOutput "$env:RUNNER_TEMP\app.out"
          Start-Sleep -Seconds 8
          if ($app.HasExited) { Get-Content "$env:RUNNER_TEMP\app.err"; throw "installed app exited early, code $($app.ExitCode)" }
          Write-Host "alive after 8s"; Stop-Process -Id $app.Id
          $un = Join-Path $dir 'unins000.exe'
          Start-Process -FilePath $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait

      - name: Upload dry-run artifacts
        if: ${{ needs.release.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: ${{ needs.release.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" out/* --clobber

  cask:
    needs: release
    if: ${{ needs.release.outputs.dry_run != 'true' && needs.release.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump Homebrew cask and the app version
        run: |
          # Without pipefail a failed download leaves shasum hashing empty input,
          # and the hash of nothing would be committed as the release's.
          set -euo pipefail
          V="${{ needs.release.outputs.version }}"
          TAG="${{ needs.release.outputs.tag }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Zyplus_${V}_aarch64.dmg"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          sed -i -e "s/^  version .*/  version \"$V\"/" -e "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/zyplus.rb
          python3 scripts/release/stamp-version.py "$V"
          # A re-run of the same tag changes nothing; that is success, not a failed commit.
          if git diff --quiet; then
            echo "Cask and version already at $V"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Casks/zyplus.rb Cargo.toml Cargo.lock
          git commit -m "chore(release): zyplus $V"
          # main may have moved since this job checked it out.
          git pull --rebase origin main
          git push origin HEAD:main
