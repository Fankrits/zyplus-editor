[package]
name = "zyplus-gpui"
version = "0.2.3"
edition = "2021"
description = "Zyplus, a markdown editor that gets out of the way"
license = "MIT"

[dependencies]
gpui = { version = "0.2.2", features = ["macos-blade"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
flate2 = "1.1.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdf-writer = "0.15.0"
rustybuzz = "0.20"
subsetter = "0.2.6"
base64 = "0.22"
minisign-verify = "0.3"
unicode-segmentation = "1.13"
mermaid-svg = "0.7"
ratex-types = "0.1.16"
ratex-parser = { version = "0.1.16", default-features = false }
ratex-layout = { version = "0.1.16", default-features = false }
ratex-svg = { version = "0.1.16", default-features = false, features = ["standalone", "embed-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# LaunchServices default-app claiming (os.rs).
core-foundation = "0.10"

# Blocking HTTP for the update check: rustls on Linux, the OS TLS elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

# cargo-bundle reads this; `bundle-macos.sh` builds the same app without it.
[package.metadata.bundle]
name = "Zyplus"
identifier = "com.fankrits.zyplus-editor"
version = "0.2.3"
category = "Productivity"
short_description = "A markdown editor that gets out of the way"
long_description = "Zyplus is a local-first markdown editor: a project tree, tabs, a rendered preview, and your files stay on your machine."
copyright = "Copyright (c) fankrits. MIT licensed."
osx_minimum_system_version = "10.15"
icon = [
    "assets/app-icons/32x32.png",
    "assets/app-icons/128x128.png",
    "assets/app-icons/128x128@2x.png",
    "assets/app-icons/icon.icns",
    "assets/app-icons/icon.ico",
]
osx_info_plist_exts = ["bundle/macos-document-types.plist"]

[dev-dependencies]
minisign = "0.10"
resvg = { version = "0.45", default-features = false }
