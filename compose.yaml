# Development database only. The API server runs on the host under `bun --watch`
# so edits reload instantly instead of costing an image rebuild per save.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: zyplus
      POSTGRES_PASSWORD: zyplus
      POSTGRES_DB: zyplus
    ports:
      - "5432:5432"
    volumes:
      - zyplus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyplus -d zyplus"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Browser UI for the database at http://localhost:8081 — users, sessions and
  # notes without writing SQL. Development only: it has no auth of its own and
  # must never be exposed anywhere the database itself would not be.
  adminer:
    image: docker.io/library/adminer:5
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  zyplus-db:
